services:
  ${SERVICE_NAME}:
    image: ${IMAGE_NAME}
    labels:
      - "io.podman.healthcheck.on-failure=kill"
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    tmpfs:
      - /run/nginx/phptmp:rw,size=5m,mode=1777
    volumes:
      - /home/${USER}/data_volume/data/html:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pgrep supervisord || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - instance_net
networks:
  instance_net:
    driver: bridge
