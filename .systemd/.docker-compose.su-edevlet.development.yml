services:
  ${SERVICE1}:
    image: ${IMAGE_NAME}
    container_name: ehp-backend
    command: sh -c "npx prisma migrate deploy && PORT=9004 npm run start"
    environment:
      NODE_ENV: production
      PORT: 1170
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:-change-me-very-secret}
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      CLIENT_URL: https://student-projects.sabanciuniv.edu/ehp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pgrep supervisord || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - instance_net
      -
  ${SERVICE2}:
    image: ${IMAGE_NAME}
    container_name: ehp-frontend
    environment:
      REACT_APP_API_URL: https://node-dev.sabanciuniv.edu/ehp/api
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - instance_net

  networks:
    instance_net:
      driver: bridge
