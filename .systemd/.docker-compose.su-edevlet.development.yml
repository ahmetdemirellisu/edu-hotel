services:
  ${SERVICE1}:
    image: ${IMAGE_NAME}
    container_name: ehp-backend
    command: sh -c "npx prisma migrate deploy && PORT=9004 npm run start"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pgrep supervisord || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - instance_net
      -
  ${SERVICE2}:
    image: ${IMAGE_NAME}
    container_name: ehp-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - instance_net

  networks:
    instance_net:
      driver: bridge
