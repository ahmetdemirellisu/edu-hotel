# 1. Global Settings
# Do not use 'user nginx;' if Supervisor starts this as the nginx user

worker_processes auto;
error_log /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Send access logs to stdout
    access_log /dev/stdout main;

    # Send error logs to stderr
    error_log /dev/stderr warn;

    # Writable paths for non-root/rootless Podman
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;
        fastcgi_hide_header Server;
        fastcgi_hide_header X-Powered-By;
        proxy_pass_header Server;



    # --- YOUR SERVER BLOCK STARTS HERE ---
    server {
        listen 8004;
        server_name _;

        # Trust Host Proxy
        set_real_ip_from  10.69.0.53;
        set_real_ip_from  172.16.0.0/12;
        set_real_ip_from  10.89.0.0/16;
        set_real_ip_from  127.0.0.1;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        # Dış Nginx proxy arkasında çalışırken port sızıntısını önler
        absolute_redirect off;
        port_in_redirect off;

        root /usr/share/nginx/html;
        index index.php;
        charset utf-8;

        # -------------------------------------------------------
        # API Proxy — dış nginx /ehp prefix'ini strip ederek gönderir
        # /ehp/api/... → /api/... olarak gelir
        # -------------------------------------------------------
        location /api/ {
            proxy_pass http://ehp-{{INSTANCE_ID}}:9004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }


        # Health Check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Static Asset Caching
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
