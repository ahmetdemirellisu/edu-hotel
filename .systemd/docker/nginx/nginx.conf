# 1. Global Settings
# Do not use 'user nginx;' if Supervisor starts this as the nginx user
pid /run/nginx/nginx.pid; # Move PID to a writable location for non-root

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Send access logs to stdout
    access_log /dev/stdout main;

    # Send error logs to stderr
    error_log /dev/stderr warn;

    # Writable paths for non-root/rootless Podman
    client_body_temp_path /run/nginx/nginx_client_body;
    proxy_temp_path       /run/nginx/nginx_proxy;
    fastcgi_temp_path     /run/nginx/nginx_fastcgi;
    uwsgi_temp_path       /run/nginx/nginx_uwsgi;
    scgi_temp_path        /run/nginx/nginx_scgi;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;
        fastcgi_hide_header Server;
        fastcgi_hide_header X-Powered-By;
        proxy_pass_header Server;


    # --- YOUR SERVER BLOCK STARTS HERE ---
    server {
        listen 8080 default_server;
        server_name _;

        # Trust Host Proxy
        set_real_ip_from  10.69.0.53;
        set_real_ip_from  172.16.0.0/12;
        set_real_ip_from  10.89.0.0/16;
        set_real_ip_from  127.0.0.1;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        root /var/www/html/public;
        index index.php;
        charset utf-8;
        # Stops Nginx from adding :8080 to trailing slash redirects
        port_in_redirect off;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM Processing (Socket must be writable by both users)
        location ~ \.php$ {
            fastcgi_pass unix:/run/nginx/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include fastcgi_params;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;
        }

        # Health Check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Static Asset Caching
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
