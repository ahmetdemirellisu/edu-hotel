[PHP]
; Performance
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit_buffer_size=100M

; Limits
memory_limit=128M
upload_max_filesize=4M
post_max_size=4M
max_execution_time=300
max_input_time=300

; Error handling
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
date.timezone=Europe/Istanbul

; Session
;auto_prepend_file=/usr/local/etc/php/php-session-bootstrap.php

; LDAP
ldap.max_links=-1

; How long a session lives (in seconds) - e.g., 2 hours
session.gc_maxlifetime = 20160

; The probability that the garbage collector runs on a given request (1/100)
session.gc_probability = 1
session.gc_divisor = 100
