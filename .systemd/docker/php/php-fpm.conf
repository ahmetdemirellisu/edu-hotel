[www]

; If you use a Unix socket, ensure the web server (Nginx) can read it
listen = /run/nginx/php-fpm.sock
listen.mode = 0660

; This tells PHP-FPM to log the header Nginx sends instead of the bridge IP
access.format = "%{HTTP_X_FORWARDED_FOR}e - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Ensure it's logging to stdout so journald picks it up
access.log = /proc/self/fd/2

; Process manager
pm = dynamic
pm.max_children = 100
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
rlimit_files = 102400


; Logging
catch_workers_output = yes
decorate_workers_output = no
;php_value[auto_prepend_file] = /usr/local/etc/php/php-session-bootstrap.php
php_admin_value[memory_limit] = 128M
php_flag[display_errors] = on
