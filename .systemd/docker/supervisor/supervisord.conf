[supervisord]
nodaemon=true
# It's better to send supervisor's own logs to stderr so you see them in journald
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/run/nginx/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
# Pipe output to the container's stdout/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
# Pipe output to the container's stdout/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
