            EOF

        - export APP_SCALE="3"
        - source "${TARGET_DIR}/.exports"
        # 2. LOGIN TO REGISTRY (Podman)
        - unset DOCKER_AUTH_CONFIG
        - echo "${CI_REGISTRY_PASSWORD}" | podman login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin

        # 3. PREPARE DIRECTORIES
        - mkdir -p "${TARGET_DIR}"

        - |
          SNAME=$(echo "$SERVICE_GROUP" | sed 's/SERVICE_GROUP: //' | tr ':' ' ')
          for NAME in $SNAME; do
            echo "Generating env for: $NAME"
            envsubst < ${SYSTEMD_REPO}/.env.${NAME}.${ENVIRONMENT_NAME} > ${TARGET_DIR}/.env.${NAME}.${ENVIRONMENT_NAME}
          done


    environment: ${ENVIRONMENT_NAME}



deploy_prod_su-mac-a:
    stage: deploy_prod_su-mac-a
    extends: .deploy-to-prod
    rules:
        - !reference [.prod_deploy_su-mac-a, rules]
    variables:
        SERVICE_NAME: ${MAIN_SERVICE1}
        IMAGE_NAME: ${IMAGE_VAR}-${SERVICE_NAME}-${IMAGE_VER}
        APP_DIR: "${ENVIRONMENT_NAME}/${SERVICE_NAME}"
        SERVICE_GROUP: ${SERVICE_GROUP1}

    script:
        - !reference [.deploy-to-prod, script]

        - envsubst < ${SYSTEMD_REPO}/pull.sh > "${TARGET_DIR}/pull.sh"
        - bash "${TARGET_DIR}/pull.sh"

        - systemctl --user daemon-reload

        - systemctl --user reset-failed
        - export CONTAINER_NAME=${SERVICE_NAME}-$i
        - export APP_PORT='${APP_PORT}'
        - envsubst < ${SYSTEMD_REPO}/.docker-compose.${SERVICE_NAME}.${ENVIRONMENT_NAME}.yml > ${TARGET_DIR}/.docker-compose.${SERVICE_NAME}.${ENVIRONMENT_NAME}.yml
        - cd "${TARGET_DIR}"
        - export INSTANCE_ID='${INSTANCE_ID}'
        - export APP_PORTS="${BASE_PORT1}"
        - bash "${TARGET_DIR}/deploy.sh"


