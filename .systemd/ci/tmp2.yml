workflow:
    rules:
        # Fix null/empty check
        - if: '$CI_PIPELINE_SOURCE == "web" && ($RUN_STAGE == "" || $RUN_STAGE == "null")'
          when: never

        # Fix regex patterns - use $VAR format for regex.
        - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_STAGE =~ /^(build|deploy)_prod_su-mac/'
          variables:
              ENVIRONMENT_NAME: "production"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:prod
          when: always

        # Fix regex patterns - use $VAR format for regex..*.
        - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_STAGE =~ /^(build|deploy)_dev_su-mac/'
          variables:
              ENVIRONMENT_NAME: "development"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:dev
          when: always

        # Use consistent variable syntax
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
          variables:
              ENVIRONMENT_NAME: "production"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:prod

        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
          variables:
              ENVIRONMENT_NAME: "staging"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:staging

        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"'
          variables:
          variables:
              ENVIRONMENT_NAME: "development"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:dev

        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
          variables:
              ENVIRONMENT_NAME: "production"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:prod
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
          variables:
              ENVIRONMENT_NAME: "staging"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:staging

        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "development"'
          variables:
              ENVIRONMENT_NAME: "development"
              IMAGE_VAR: ${CI_REGISTRY_IMAGE}:dev

        - when: never

stages:
    - build_dev_su-mac-a
    - build_dev_su-mac-b
    - build_dev_su-mac-c
    - build_prod_su-mac-a
    - build_prod_su-mac-b
