    - dev_cleanup_and_prepare
    - deploy_dev_su-mac-a
    - deploy_dev_su-mac-b
    - deploy_dev_su-mac-c
    - prod_cleanup_and_prepare
    - deploy_prod_su-mac-a
    - deploy_prod_su-mac-b
    - deploy_prod_su-mac-c

.stage_logic:
    rules:
        - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_STAGE == $CI_JOB_STAGE'
          when: always
        - if: '$CI_PIPELINE_SOURCE == "web"'
          when: never

.prod_build_su-mac-a:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $SKIP_BUILD != "true"'
          changes:
              - "**/*"
              - "!.gitlab-ci.yml"

.prod_build_su-mac-b:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $SKIP_BUILD != "true"'
          changes:
              - "**/*"
              - "!.gitlab-ci.yml"

.prod_build_su-mac-c:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $SKIP_BUILD != "true"'
          changes:
              - "**/*"
              - "!.gitlab-ci.yml"

.prod_deploy_su-mac-a:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $SKIP_DEPLOY != "true"'
          changes:
              - "**/*"
              - "!.gitlab-ci.yml"

.prod_deploy_su-mac-b:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $SKIP_DEPLOY != "true"'
          changes:
