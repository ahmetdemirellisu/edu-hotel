          changes:
              - "**/*"
              - "!.gitlab-ci.yml"

.dev_build_su-mac-a:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "development" && $SKIP_BUILD != "true"'

.dev_build_su-mac-b:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "development" && $SKIP_BUILD != "true"'

.dev_build_su-mac-c:
    rules:
        - !reference [.stage_logic, rules]
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "development" && $SKIP_BUILD != "true"'

.dev_deploy_su-mac-a:
