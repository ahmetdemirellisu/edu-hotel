variables:
    IMAGE_VER: latest
    DOCKER_HOST: "unix:///run/user/$(id -u)/podman/podman.sock"
    BASE_IMAGES_REGISTRY: igs.sabanciuniv.edu:5050/imagebase/images
    SERVICE_GROUP1: su-mac-a:su-mac-a-nginx
    SERVICE_GROUP2: su-mac-b:su-mac-b-nginx
    SERVICE_GROUP3: su-mac-c:su-mac-c-nginx
    MAIN_SERVICE1: su-mac-a
    MAIN_SERVICE2: su-mac-b
    MAIN_SERVICE3: su-mac-c
    BUILD_VOLUME_PATH: /app/vendor
    CODE_DIR: /home/${USER}/data_volume/data/html
    SCALE: 1
    SKIP_BUILD: false
    SKIP_DEPLOY: false
    BASE_PORT1: "1100"
    BASE_PORT2: "1110"
    BASE_PORT3: "1120"
    LOG_STRING: "1a"
    VOLUME_PATH: /data
    SYSTEMD_REPO: "${CI_PROJECT_DIR}/.systemd"
    CLEAN_SCRIPT: "${SYSTEMD_REPO}/clean.sh"
    DEPLOY_SCRIPT: "${SYSTEMD_REPO}/deploy.sh"
    STOP_SCRIPT: "${SYSTEMD_REPO}/stop.sh"
    LOCAL_SCRIPT: "${SYSTEMD_REPO}/local.sh"
    SCALE_SCRIPT: "${SYSTEMD_REPO}/scale.sh"

    # SKIP_BUILD Logic
    # To skip build manually, Run Pipeline > Add Variable: SKIP_BUILD = "true"

# ---------------------------------------------------
# JOB 1: BUILD & PUSH
# Runs on: builder1 (Podman-in-Podman)
# ---------------------------------------------------
.build-container:
    tags:
        - sgs-test-builder-runner # Updated to match your PinP runner
    image: ${BASE_IMAGES_REGISTRY}/builder-base:latest # Necessary for Docker/PinP executor..

    variables:
    resource_group: ${ENVIRONMENT_NAME}

    before_script:
        - echo "${CI_REGISTRY_PASSWORD}" | podman login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
        #- echo "${REGISTRY_PASSWORD}" | podman login dhi.io -u "${REGISTRY_USER}" --password-stdin
        - echo "${IMAGE_BASE_PASSWORD}" | podman login ${BASE_IMAGES_REGISTRY} -u ${IMAGE_BASE_USER} --password-stdin
        # Create .env file securely with variables from GitLab CI/CD Settings

        #Only add if needed
        # - envsubst < ${SYSTEMD_REPO}/.env.${SERVICE_NAME}.${ENVIRONMENT_NAME} > .env
    environment: ${ENVIRONMENT_NAME}


build_dev_su-mac-a:
    stage: build_dev_su-mac-a
    extends: .build-container
    rules:
        - !reference [.dev_build_su-mac-a, rules]
    variables:
        SERVICE_NAME: ${MAIN_SERVICE1}
        IMAGE_NAME: ${IMAGE_VAR}-${SERVICE_NAME}-${IMAGE_VER}
        APP_DIR: "${ENVIRONMENT_NAME}/${SERVICE_NAME}"

    script:
        - echo "Building image ${IMAGE_NAME} on Native Podman..."
        - echo "Getting driver..."
        - podman info | grep -E "graphDriverName|Native Overlay Diff"
        - podman info
        - podman images
        - echo "Getting driver end..."
        - podman build -v /next:/app/.next/cache:Z -v /npm:/root/.npm:Z -v /in_container_test/build:/data:Z -t ${IMAGE_NAME} -f ${SYSTEMD_REPO}/.Dockerfile.${SERVICE_NAME}.${ENVIRONMENT_NAME} .
        - echo "Pushing to igs.sabanciuniv.edu Registry..."
        - podman push ${IMAGE_NAME}
    environment: ${ENVIRONMENT_NAME}


