server {
    listen 8004;
    server_name _;

    # Dış Nginx proxy arkasında çalışırken port sızıntısını önler
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------
    # API Proxy — dış nginx /ehp prefix'ini strip ederek gönderir
    # /ehp/api/... → /api/... olarak gelir
    # -------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:9004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # SPA — tüm route'lar index.html'e düşer
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
